---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-operator
  namespace: flux-system
spec:
  chart:
    spec:
      chart: redis-operator
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: redis
      version: 0.23.0
  install:
    createNamespace: true
  interval: 10m0s
  storageNamespace: kube-system
  targetNamespace: kube-system

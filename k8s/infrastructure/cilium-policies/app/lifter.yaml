---
# lifter (namespace lifter): web (:80) + api (:8000) + CNPG cluster lifter-db.
# HelmRelease app-template (k8s/apps/lifter/app/helm-release.yaml).
# Public route lifter.grendel71.net on envoy-external -> Service web:80 (rules.backendRefs web:80).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lifter-web-ingress
  namespace: lifter
spec:
  # Live: 1 Running pod (lifter-web-*).
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: lifter
      app.kubernetes.io/instance: lifter
      app.kubernetes.io/controller: web
  ingress:
    # Envoy proxy of the external gateway -> web, TCP 80 only (containerPort http).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
            app.kubernetes.io/component: proxy
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
---
# api: not routed publicly (the HTTPRoute only has the web backend), reached
# only by the web pod, which proxies /api to Service api:8000
# (helm-release.yaml comment: the web image proxies /api/ to http://api:8000).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lifter-api-ingress
  namespace: lifter
spec:
  # Live: 1 Running pod (lifter-api-*).
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: lifter
      app.kubernetes.io/instance: lifter
      app.kubernetes.io/controller: api
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: lifter
            app.kubernetes.io/instance: lifter
            app.kubernetes.io/controller: web
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
# lifter-db (CNPG). Ingress default-deny: the api pod on 5432 (env points at
# lifter-db-rw:5432; only the api has DB credentials), the CNPG operator
# (8000 + 5432) and instances of the same cluster. Egress is OPEN (CNPG instance
# pods must reach the API server and replicas).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lifter-db-ingress
  namespace: lifter
spec:
  # Live: 1 Running pod (lifter-db-1).
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: lifter-db
      cnpg.io/podRole: instance
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: lifter
            app.kubernetes.io/instance: lifter
            app.kubernetes.io/controller: api
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: lifter-db
            cnpg.io/podRole: instance
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
---
# Egress: block direct access to the LAN, the cluster nodes and the internal
# reverse-proxy paths (SSRF / lateral movement from a public-facing app), keep
# everything else open. WHAT THIS DOES AND DOES NOT COVER:
#  * Cilium kube-proxy replacement translates a Service frontend (ClusterIP,
#    NodePort, MetalLB LoadBalancer VIP) to a BACKEND before policy is
#    evaluated, so policy never sees the VIP (192.168.1.67-.72). A destination
#    CIDR deny therefore does NOT cover a LoadBalancer VIP whose backends are
#    pods. The proxies behind the internal VIPs are denied by identity instead:
#      - envoy-internal (.69: router, pve, truenas, dns, s3, rook, hubble, the
#        *arr apps... on *.internal.grendel71.net), envoy-nx (.71) and tcp-gateway
#        (.72): Envoy proxy pods in envoy-gateway-system, selected by the
#        gateway.envoyproxy.io/owning-gateway-name label. Live: 1 Running pod
#        each (3 together).
#      - traefik-internal (.68): pods app.kubernetes.io/name=traefik in
#        namespace traefik-internal. Live: 1 Running pod.
#    envoy-external (.67) is NOT denied: it is this app's own public path, and
#    nothing in helm-release.yaml makes the app call a hostname (the only
#    grendel71.net name in the file is its own route). If a pod's resolver
#    returned an internal gateway VIP for a public name, that path would be
#    blocked, which is intended.
#  * Also blocked: direct LAN IPs (192.168.0.0/16, includes the VIP/node
#    addresses if a pod dials them as plain IPs without Service translation),
#    NodePort on a node IP and kube-apiserver (`host` + `remote-node`, node IPs
#    192.168.1.145/.176/.154 and VIP .100), and Services whose backends are LAN
#    IPs (selectorless Services such as kube-system pve/pve2).
#  * NOT blocked (residual): any other pod reachable through a ClusterIP
#    Service or pod IP (10.244.0.0/16 / 10.96.0.0/12), e.g. other apps'
#    Services or in-cluster admin UIs. This policy is not in-cluster
#    segmentation. Add ingress policies on those targets or extend this deny
#    if needed.
#  * Nothing in the manifests points these pods at a LAN or node address: the
#    full env of both containers is in helm-release.yaml (DB host
#    lifter-db-rw, in-cluster, and app settings only). Image pulls and the
#    NFS/CSI mounts are done by the kubelet on the host, not by pod traffic.
#    These apps do not use the Kubernetes API (no ServiceAccount use, no k8s
#    client in the env).
#  * enableDefaultDeny.egress=false is REQUIRED: with the chart default
#    enableNonDefaultDenyPolicies=true a policy that only has egressDeny would
#    otherwise switch the pods to egress default-deny and drop all egress.
#  * Deny wins over allow in Cilium, so no LAN destination is allowed here. If a
#    LAN dependency is ever added (SMTP relay, NFS client, LDAP...), carve it out
#    by changing this policy (deny with except), not by adding an allow.
#  * Pod CIDR 10.244.0.0/16 and service CIDR 10.96.0.0/12 are NOT inside
#    192.168.0.0/16, so DNS, the DB and api<->web keep working.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lifter-egress-deny-lan
  namespace: lifter
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: lifter
      app.kubernetes.io/instance: lifter
  enableDefaultDeny:
    egress: false
  egressDeny:
    - toCIDRSet:
        - cidr: 192.168.0.0/16
    - toEntities:
        - host
        - remote-node
    # Internal-facing Envoy Gateway proxies (admin UIs behind envoy-internal,
    # envoy-nx, tcp-gateway). envoy-external is deliberately NOT listed.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
            app.kubernetes.io/component: proxy
          matchExpressions:
            - key: gateway.envoyproxy.io/owning-gateway-name
              operator: In
              values:
                - envoy-internal
                - envoy-nx
                - tcp-gateway
    # Traefik internal ingress (LoadBalancer 192.168.1.68).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik-internal
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-internal-traefik-internal

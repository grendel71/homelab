---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-site
  namespace: flux-system
spec:
  interval: 10m0s
  releaseName: runner-site
  targetNamespace: arc-runners
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.15.0
      sourceRef:
        kind: HelmRepository
        name: arc-gha
  values:
    githubConfigUrl: https://github.com/grendel71/hugo-site
    githubConfigSecret: arc-github-app
    runnerScaleSetName: runner-site
    minRunners: 0
    maxRunners: 2
    controllerServiceAccount:
      namespace: arc-systems
      name: gha-runner-scale-set-controller
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.337.0
            command: ["/home/runner/run.sh"]

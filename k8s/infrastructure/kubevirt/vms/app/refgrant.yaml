apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-ubuntu-ssh-tcp
  namespace: kubevirt
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: TCPRoute
      namespace: kubevirt
  to:
    - group: ""
      kind: Service
      name: ubuntu-vm-ssh
      namespace: kubevirt

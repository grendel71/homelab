apiVersion: v1
kind: Service
metadata:
  name: ubuntu-vm-ssh
  namespace: kubevirt
spec:
  type: LoadBalancer
  selector:
    kubevirt.io/domain: ubuntu-vm
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
 name: ubuntu-ssh
 namespace: kubevirt
spec:
 parentRefs:
   - name: tcp-gateway
     namespace: envoy-gateway-system
     sectionName: foo
 rules:
   - backendRefs:
       - name: ubuntu-vm-ssh
         namespace: kubevirt
         port: 22


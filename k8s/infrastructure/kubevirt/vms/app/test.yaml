apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: ubuntu-vm
  namespace: kubevirt
spec:
  runStrategy: Always

  template:
    metadata:
      labels:
        kubevirt.io/domain: ubuntu-vm

    spec:
      domain:
        resources:
          requests:
            memory: 2Gi
            cpu: "2"

        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio

      volumes:
        - name: rootdisk
          containerDisk:
            image: quay.io/containerdisks/ubuntu:24.04

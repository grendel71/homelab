apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubevirt-cr
  namespace: kube-system
spec:
  interval: 30m
  targetNamespace: kubevirt
  dependsOn:
  - name: kubevirt-operator
  chart:
    spec:
      chart: kubevirt-cr
      version: "1.9.0"
      sourceRef:
        kind: HelmRepository
        name: kubevirt
        namespace: flux-system
  install:
    remediation:
      remediateLastFailure: false
  upgrade:
    remediation:
      remediateLastFailure: false
  driftDetection:
    mode: warn
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: KubeVirt
          name: kubevirt
        patch: |
          - op: replace
            path: /spec/configuration/developerConfiguration/featureGates
            value:
            - Sidecar
            - DeclarativeHotplugVolumes

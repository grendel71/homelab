apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cdi-cr
  namespace: kube-system
spec:
  interval: 30m
  targetNamespace: cdi
  dependsOn:
  - name: cdi-operator
  chart:
    spec:
      chart: cdi-cr
      version: "1.65.0"
      sourceRef:
        kind: HelmRepository
        name: kubevirt
        namespace: flux-system
  install:
    remediation:
      remediateLastFailure: false
  upgrade:
    remediation:
      remediateLastFailure: false
  driftDetection:
    mode: warn
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: CDI
          name: cdi
        patch: |
          - op: replace
            path: /spec/config/featureGates
            value:
            - HonorWaitForFirstConsumer
            - WebhookPvcRendering

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cdi-operator
  namespace: kube-system
spec:
  interval: 30m
  targetNamespace: cdi
  chart:
    spec:
      chart: cdi-operator
      version: "1.65.0"
      sourceRef:
        kind: HelmRepository
        name: kubevirt
        namespace: flux-system
  install:
    crds: Create
    remediation:
      remediateLastFailure: false
  upgrade:
    crds: CreateReplace
    remediation:
      remediateLastFailure: false
  driftDetection:
    mode: enabled
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Namespace
          name: cdi
        patch: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: cdi
            annotations:
              helm.sh/resource-policy: keep

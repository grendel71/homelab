---
# Hubble UI HTTPRoute, separated from the Cilium HelmRelease Kustomization.
#
# Rationale: the HTTPRoute needs the envoy-internal Gateway (and thus the Envoy
# Gateway stack) to exist, but the Cilium HelmRelease Kustomization must stay
# dependency-free (except `sources`) so the CNI can be installed as early as
# possible and cannot form a bootstrap cycle (Envoy Gateway needs a pod network
# to run; on a fresh cluster Cilium would never install if it waited on the
# gateway stack first).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-routes
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: cilium
    - name: envoy-gateway-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/infrastructure/cilium/routes
  prune: true
  wait: true
  timeout: 5m

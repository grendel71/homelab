apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: etcd-backup
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/infrastructure/etcd-backup/app
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: namespace
    - name: infra-secrets

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/infrastructure/storage/app
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: ceph-cluster
    - name: namespace

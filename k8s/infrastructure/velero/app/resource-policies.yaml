---
apiVersion: v1
kind: ConfigMap
metadata:
  name: velero-resource-policies
  namespace: kube-system
data:
  policies.yaml: |
    version: v1
    includeExcludePolicy:
      includedNamespacesByLabel:
        - "backup.grendel71.net/enabled=true"
    volumePolicies:
      - conditions:
          nfs: {}
        action:
          type: skip

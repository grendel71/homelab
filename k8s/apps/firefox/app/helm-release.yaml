---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: firefox
  namespace: apps 
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      firefox:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/firefox
              tag: latest
            ports:
              - name: https
                containerPort: 3000
    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /config
    service:
      app:
        controller: firefox
        ports:
          https:
            port: 3000

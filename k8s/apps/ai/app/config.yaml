# Hermes Agent config. Copied to /opt/data/config.yaml by the init container.
# Full reference:
# https://github.com/NousResearch/hermes-agent/blob/main/cli-config.yaml.example
model:
  default: "chatgpt-gpt-6.2-sol"
  provider: "custom:litellm"

# All models go through LiteLLM over the Responses API. LiteLLM sends the
# ChatGPT routes natively and converts DeepSeek to Chat Completions.
# Switch with `/model custom:litellm:<model>`.
providers:
  litellm:
    name: "LiteLLM"
    api: "http://litellm-gateway.litellm.svc.cluster.local:4000/v1"
    key_env: "LITELLM_API_KEY"
    transport: "codex_responses"
    default_model: "chatgpt-gpt-6.2-sol"
    discover_models: true
    models:
      chatgpt-gpt-6.2-astra:
        context_length: 1050000
      chatgpt-gpt-6.2-sol:
        context_length: 1050000
      chatgpt-gpt-6.1-terra:
        context_length: 1050000
      chatgpt-gpt-6-luna:
        context_length: 1050000
      deepseek-v4-pro:
        context_length: 1048576

terminal:
  backend: "local"
  cwd: "/opt/data"
  timeout: 180

compression:
  enabled: true
  threshold: 0.50

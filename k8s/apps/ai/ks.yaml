---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes-agent
  namespace: flux-system
spec:
  targetNamespace: ai
  interval: 30m
  path: ./k8s/apps/ai/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  components:
    - ../../../common/all-namespaces
  dependsOn:
    - name: namespace
    - name: storage
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  timeout: 5m
  wait: false

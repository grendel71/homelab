apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lifter
  namespace: lifter
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      api:
        strategy: Recreate
        containers:
          app:
            image:
              repository: bhcr8192.duckdns.org/lifter-api
              # Flux image automation sets this to the newest epoch tag.
              tag: "1794803174" # {"$imagepolicy": "lifter:lifter-api-policy:tag"}
            ports:
              - name: http
                containerPort: 8000
            env:
              - name: PG_USER
                valueFrom:
                  secretKeyRef:
                    name: lifter-db-secret
                    key: username
              - name: PG_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: lifter-db-secret
                    key: password
              - name: PG_HOST
                value: lifter-db-rw
              - name: PG_PORT
                value: "5432"
              - name: PG_DB_NAME
                value: lifter
              - name: PRIVKEY
                valueFrom:
                  secretKeyRef:
                    name: lifter-app-secret
                    key: privkey
              - name: MAX_INVITE_HOURS
                value: "168"
            resources:
              requests:
                memory: 128Mi
                cpu: 100m
              limits:
                memory: 512Mi
                cpu: 500m
      web:
        strategy: Recreate
        containers:
          app:
            image:
              repository: bhcr8192.duckdns.org/lifter-web
              # Flux image automation sets this to the newest epoch tag.
              tag: "1794803174" # {"$imagepolicy": "lifter:lifter-web-policy:tag"}
            ports:
              - name: http
                containerPort: 80
            resources:
              requests:
                memory: 64Mi
                cpu: 50m
              limits:
                memory: 256Mi
                cpu: 250m
    # The web image proxies /api/ to http://api:8000, so the Service name
    # "api" and port 8000 must stay as they are.
    service:
      api:
        forceRename: api
        controller: api
        ports:
          http:
            port: 8000
      web:
        forceRename: web
        controller: web
        ports:
          http:
            port: 80
    route:
      external:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        hostnames:
          - lifter.grendel71.net
        parentRefs:
          - name: envoy-external
            namespace: envoy-gateway-system
            sectionName: https
        rules:
          - backendRefs:
              - name: web
                port: 80

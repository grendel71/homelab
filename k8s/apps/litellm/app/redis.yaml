---
# Standalone Redis for LiteLLM coordination (rate limits, spend tracking).
# Auth comes from the litellm-redis Secret via redisStandalone.redisSecret.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm-redis
  namespace: litellm
spec:
  interval: 30m
  releaseName: litellm-redis
  dependsOn:
    - name: redis-operator
      namespace: flux-system
  chart:
    spec:
      chart: redis
      version: 0.16.10
      sourceRef:
        kind: HelmRepository
        name: redis
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    redisStandalone:
      name: litellm-redis
      redisSecret:
        secretName: litellm-redis
        secretKey: password
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
    # Creates a ClusterIP Service with a fixed name: litellm-redis-external-service
    externalService:
      enabled: true
      serviceType: ClusterIP
      port: 6379
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: replicated-x3-block-store
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi

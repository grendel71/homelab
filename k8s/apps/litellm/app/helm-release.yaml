---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
  namespace: litellm
spec:
  interval: 30m
  postRenderers:
    # The componentized chart does not expose initContainers. Seed the writable
    # token PVC before the gateway starts; subsequent starts preserve the
    # refreshed token written by LiteLLM.
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Deployment
              name: litellm-gateway
            patch: |
              - op: add
                path: /spec/template/spec/initContainers
                value:
                  - name: seed-chatgpt-auth
                    image: busybox:1.37
                    command:
                      - sh
                      - -ec
                      - |
                        if [ ! -s /tokens/auth.json ]; then
                          cp /seed/auth.json /tokens/auth.json
                          chmod 0660 /tokens/auth.json
                        fi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                      runAsGroup: 65532
                      runAsNonRoot: true
                      runAsUser: 65532
                      seccompProfile:
                        type: RuntimeDefault
                    volumeMounts:
                      - name: chatgpt-auth-seed
                        mountPath: /seed
                        readOnly: true
                      - name: chatgpt-tokens
                        mountPath: /tokens
  chart:
    spec:
      chart: litellm
      version: "1.109.1"
      sourceRef:
        kind: HelmRepository
        name: litellm
        namespace: flux-system
      interval: 12h
  values:
    # Image tags default to the chart appVersion (v1.109.1), so the chart
    # version pins the images too.
    # Gives clean Service names: litellm-gateway, litellm-backend, litellm-ui.
    fullnameOverride: litellm
    # In-cluster CloudNativePG cluster (see db.yaml).
    database:
      writer:
        host: litellm-db-rw
        dbname: litellm
        passwordSecret:
          name: litellm-db-secret
    # In-cluster redis-operator standalone (see redis.yaml). No TLS on the
    # internal link, so the ArgoCD `ssl`/`sslCertReqs` flags are dropped.
    redis:
      host: litellm-redis-external-service
      passwordSecret:
        name: litellm-redis
    gateway:
      envSecrets:
        - litellm-env
        - litellm-sso
      extraEnv:
        - name: STORE_MODEL_IN_DB
          value: "True"
        - name: CHATGPT_TOKEN_DIR
          value: /tokens
      # The ChatGPT refresh token is single-use. Keep one gateway process and
      # one pod on the RWO volume so two workers cannot refresh it concurrently.
      numWorkers: 1
      hpa:
        enabled: false
      replicaCount: 1
      strategy:
        type: Recreate
      podSecurityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: chatgpt-auth-seed
          secret:
            secretName: litellm-chatgpt-auth
        - name: chatgpt-tokens
          persistentVolumeClaim:
            claimName: litellm-chatgpt-tokens
      volumeMounts:
        - name: chatgpt-tokens
          mountPath: /tokens
      config:
        proxy_config:
          model_list:
            - model_name: chatgpt-gpt-6.2-astra
              litellm_params:
                model: chatgpt/gpt-6.2-astra
              model_info:
                mode: responses
            - model_name: chatgpt-gpt-6.2-sol
              litellm_params:
                model: chatgpt/gpt-6.2-sol
              model_info:
                mode: responses
            - model_name: chatgpt-gpt-6.1-terra
              litellm_params:
                model: chatgpt/gpt-6.1-terra
              model_info:
                mode: responses
            - model_name: chatgpt-gpt-6-luna
              litellm_params:
                model: chatgpt/gpt-6-luna
              model_info:
                mode: responses
            - model_name: deepseek-v4-pro
              litellm_params:
                model: deepseek/deepseek-v4-pro
                api_key: os.environ/DEEPSEEK_API_KEY
    backend:
      envSecrets:
        - litellm-env
        - litellm-sso
      extraEnv:
        - name: STORE_MODEL_IN_DB
          value: "True"
    # FluxCD runs migrations as a Helm pre-install/pre-upgrade hook (the
    # ArgoCD PreSync hook is not used).
    migrationJob:
      hooks:
        helm:
          enabled: true
        argocd:
          enabled: false

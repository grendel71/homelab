---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm
  namespace: flux-system
spec:
  targetNamespace: litellm
  interval: 30m
  path: ./k8s/apps/litellm/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: namespace
    - name: sources
    - name: cloudnative-pg
    - name: storage
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: litellm
      namespace: litellm
  timeout: 5m
  wait: false

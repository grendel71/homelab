---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
  namespace: torrent
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      radarr:
        containers:
          app:
            image:
              repository: linuxserver/radarr
              # Pinned to the digest running on 2026-11-18. To update: pull latest, test, change the digest.
              tag: latest@sha256:044788f5508b7f67a3e0368cdd142c77c4d4cd5aec2efaba53e1a68b6b6231e7
            ports:
              - name: http
                containerPort: 7878
            env:
              PUID: "1000"
              PGID: "1000"
              # Login is done by Authentik OIDC at Envoy Gateway (SecurityPolicy radarr-oidc).
              # Do NOT remove the SecurityPolicy while this is set: the UI would be open.
              RADARR__AUTH__METHOD: External
              RADARR__AUTH__REQUIRED: Enabled
            # LinuxServer s6 init starts as root, chowns /config, then switches to PUID/PGID.
            # These six capabilities are kept (KILL: s6 must signal the service that runs as PUID); the rest are dropped.
            # readOnlyRootFilesystem and runAsNonRoot are not possible with this image.
            securityContext:
              allowPrivilegeEscalation: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "KILL", "SETGID", "SETUID"]
    persistence:
      config:
        existingClaim: radarr-config-pvc
        globalMounts:
          - path: /config
      downloads:
        existingClaim: torrent-nfs-pvc
        globalMounts:
          - path: /downloads
            subPath: qb/downloads
      media:
        existingClaim: torrent-nfs-pvc
        globalMounts:
          - path: /nfs-media
            subPath: poolshare1/media
    service:
      app:
        controller: radarr
        ports:
          http:
            port: 7878
    route:
      internal:
        hostnames:
          - radarr.internal.grendel71.net
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway-system
            sectionName: websecure

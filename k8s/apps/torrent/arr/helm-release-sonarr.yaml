---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
  namespace: torrent
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      sonarr:
        containers:
          app:
            image:
              repository: linuxserver/sonarr
              # Pinned to the digest running on 2026-11-18. To update: pull latest, test, change the digest.
              tag: latest@sha256:c7d1df25e428da6c9ace05daea0d34e59522978a3843ea1944812f855af4086c
            ports:
              - name: http
                containerPort: 8989
            env:
              PUID: "1000"
              PGID: "1000"
              # Login is done by Envoy Gateway basic auth (SecurityPolicy sonarr-basic-auth).
              # Do NOT remove the SecurityPolicy while this is set: the UI would be open.
              SONARR__AUTH__METHOD: External
              SONARR__AUTH__REQUIRED: Enabled
    persistence:
      config:
        existingClaim: sonarr-config-pvc
        globalMounts:
          - path: /config
      downloads:
        existingClaim: torrent-nfs-pvc
        globalMounts:
          - path: /downloads
            subPath: qb/downloads
      media:
        existingClaim: torrent-nfs-pvc
        globalMounts:
          - path: /nfs-media
            subPath: poolshare1/media
    service:
      app:
        controller: sonarr
        ports:
          http:
            port: 8989
    route:
      internal:
        hostnames:
          - sonarr.internal.grendel71.net
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway-system
            sectionName: websecure

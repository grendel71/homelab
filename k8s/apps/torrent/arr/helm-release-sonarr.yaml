---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
  namespace: torrent
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      sonarr:
        containers:
          app:
            image:
              repository: linuxserver/sonarr
              tag: latest
            ports:
              - name: http
                containerPort: 8989
            env:
              PUID: "1000"
              PGID: "1000"
    persistence:
      config:
        existingClaim: sonarr-config-pvc
        globalMounts:
          - path: /config
      downloads:
        existingClaim: torrent-nfs-pvc
        globalMounts:
          - path: /downloads
            subPath: qb/downloads
      media:
        existingClaim: torrent-nfs-pvc
        globalMounts:
          - path: /nfs-media
            subPath: poolshare1/media
    service:
      app:
        controller: sonarr
        ports:
          http:
            port: 8989
    route:
      internal:
        hostnames:
          - sonarr.envoy.grendel71.net
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway-system
            sectionName: websecure

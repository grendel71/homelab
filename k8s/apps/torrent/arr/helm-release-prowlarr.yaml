---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: torrent
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      prowlarr:
        containers:
          app:
            image:
              repository: linuxserver/prowlarr
              # Pinned to the digest running on 2026-11-18. To update: pull latest, test, change the digest.
              tag: latest@sha256:45117ba8439e2337a92ffe38a451a4dafc0be771754d05d88cdf102419d09646
            ports:
              - name: http
                containerPort: 9696
            env:
              PUID: "1000"
              PGID: "1000"
              # Login is done by Authentik OIDC at Envoy Gateway (SecurityPolicy prowlarr-oidc).
              # Do NOT remove the SecurityPolicy while this is set: the UI would be open.
              PROWLARR__AUTH__METHOD: External
              PROWLARR__AUTH__REQUIRED: Enabled
            # LinuxServer s6 init starts as root, chowns /config, then switches to PUID/PGID.
            # These six capabilities are kept (KILL: s6 must signal the service that runs as PUID); the rest are dropped.
            # readOnlyRootFilesystem and runAsNonRoot are not possible with this image.
            securityContext:
              allowPrivilegeEscalation: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "KILL", "SETGID", "SETUID"]
    persistence:
      config:
        existingClaim: prowlarr-config-pvc
        globalMounts:
          - path: /config
    service:
      app:
        controller: prowlarr
        ports:
          http:
            port: 9696
    route:
      internal:
        hostnames:
          - prowlarr.internal.grendel71.net
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway-system
            sectionName: websecure

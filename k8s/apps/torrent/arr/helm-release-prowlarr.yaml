---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: torrent
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      prowlarr:
        containers:
          app:
            image:
              repository: linuxserver/prowlarr
              tag: latest
            ports:
              - name: http
                containerPort: 9696
            env:
              PUID: "1000"
              PGID: "1000"
    persistence:
      config:
        existingClaim: prowlarr-config-pvc
        globalMounts:
          - path: /config
    service:
      app:
        controller: prowlarr
        ports:
          http:
            port: 9696
    route:
      internal:
        hostnames:
          - prowlarr.envoy.grendel71.net
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway-system
            sectionName: websecure

---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: sonarr-oidc
  namespace: torrent
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: sonarr
  oidc:
    provider:
      issuer: "https://ak.grendel71.net/application/o/arr/"
    clientID: "arr"
    clientSecret:
      name: arr-oidc
    redirectURL: "https://sonarr.internal.grendel71.net/oauth2/callback"
    logoutPath: "/oauth2/logout"
    scopes:
      - profile
      - email

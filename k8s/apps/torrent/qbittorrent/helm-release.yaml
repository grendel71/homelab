---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
  namespace: torrent
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      qbittorrent:
        initContainers:
          gluetun:
            restartPolicy: Always
            image:
              repository: ghcr.io/qdm12/gluetun
              # Pinned to the tested :latest build of 2026-11-12 (commit 450ce09).
              # Last tagged release is v3.41.3 (older).
              tag: latest@sha256:cbafe0945d0fe5a3c55ca64d43a85c5db270458f4c645ee65797b527f6f57a64
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
            env:
              # gluetun INPUT policy is DROP. Allow the qBittorrent WebUI
              # (shared pod network) so Envoy and other pods can reach it.
              FIREWALL_INPUT_PORTS: "8080"
            envFrom:
              - secretRef:
                  name: airvpn-secret
        containers:
          app:
            image:
              repository: linuxserver/qbittorrent
              tag: latest
            ports:
              - name: webui
                containerPort: 8080
            env:
              PUID: "1000"
              PGID: "1000"
    persistence:
      config:
        existingClaim: torrent-config-pvc
        globalMounts:
          - path: /config
      downloads:
        existingClaim: torrent-nfs-pvc
        globalMounts:
          - path: /downloads
            subPath: qb/downloads
    service:
      app:
        controller: qbittorrent
        ports:
          webui:
            port: 8080
    route:
      internal:
        hostnames:
          - qb.internal.grendel71.net
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway-system
            sectionName: websecure

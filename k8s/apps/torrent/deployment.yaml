---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gluetun-deployment
  namespace: torrent
  labels:
    app: gluetun
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gluetun
  template:
    metadata:
      labels:
        app: gluetun
    spec:
      initContainers:
        - name: gluetun
          # if you do not add restartPolicy the other init containers will never start
          # it will be an initContainer and not a native sidecar container https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/
          restartPolicy: Always
          image: ghcr.io/qdm12/gluetun
          imagePullPolicy: Always
          securityContext:
            capabilities:
              add:
                - "NET_ADMIN"
          envFrom:
            - secretRef:
                name: airvpn-secret
      containers:
        - name: qbittorrent
          image: linuxserver/qbittorrent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: webui
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: torrent-data
              mountPath: /downloads
              subPath: downloads
      volumes:
        - name: torrent-data
          persistentVolumeClaim:
            claimName: torrent-nfs-pvc

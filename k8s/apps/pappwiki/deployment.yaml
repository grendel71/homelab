apiVersion: apps/v1
kind: Deployment
metadata:
  name: pappwiki
  namespace: pappwiki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pappwiki
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pappwiki
    spec:
      containers:
        - name: wikijs
          image: requarks/wiki:2
          ports:
            - containerPort: 3000
          env:
            - name: DB_TYPE
              value: postgres
            - name: DB_HOST
              value: pappwiki-db-rw
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: pappwiki
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: pappwiki-db-secret
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: pappwiki-db-secret
                  key: password
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

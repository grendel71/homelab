---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pappwiki
  namespace: flux-system
spec:
  targetNamespace: pappwiki
  interval: 10m
  path: ./k8s/apps/pappwiki/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  components:
    - ../../../common/all-namespaces
  dependsOn:
    - name: namespace
    - name: cloudnative-pg
    - name: storage
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: pappwiki
      namespace: pappwiki
  timeout: 5m
  wait: true

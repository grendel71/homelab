---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pappwiki
  namespace: pappwiki
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      pappwiki:
        strategy: Recreate
        containers:
          app:
            image:
              repository: requarks/wiki
              tag: "2"
            ports:
              - name: http
                containerPort: 3000
            env:
              DB_TYPE: postgres
              DB_HOST: pappwiki-db-rw
              DB_PORT: "5432"
              DB_NAME: pappwiki
              DB_USER:
                valueFrom:
                  secretKeyRef:
                    name: pappwiki-db-secret
                    key: username
              DB_PASS:
                valueFrom:
                  secretKeyRef:
                    name: pappwiki-db-secret
                    key: password
            resources:
              requests:
                memory: 256Mi
                cpu: 100m
              limits:
                memory: 512Mi
                cpu: 500m
    service:
      app:
        controller: pappwiki
        ports:
          http:
            port: 3000
    route:
      internal:
        hostnames:
          - papp.envoy.grendel71.net
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway-system
            sectionName: websecure

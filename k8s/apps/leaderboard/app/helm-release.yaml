---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: leaderboard
  namespace: leaderboard
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      api:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/grendel71/leaderboard-api
              tag: sha-fc3971d
            ports:
              - name: http
                containerPort: 8080
            env:
              - name: DB_USER
                valueFrom:
                  secretKeyRef:
                    name: leaderboard-db-secret
                    key: username
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: leaderboard-db-secret
                    key: password
              - name: DATABASE_URL
                value: postgres://$(DB_USER):$(DB_PASSWORD)@leaderboard-db-rw:5432/leaderboard
            resources:
              requests:
                memory: 128Mi
                cpu: 100m
              limits:
                memory: 512Mi
                cpu: 500m
      web:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/grendel71/leaderboard-web
              tag: sha-fc3971d
            ports:
              - name: http
                containerPort: 80
            resources:
              requests:
                memory: 64Mi
                cpu: 50m
              limits:
                memory: 256Mi
                cpu: 250m
    service:
      api:
        forceRename: api
        controller: api
        ports:
          http:
            port: 8080
      web:
        forceRename: web
        controller: web
        ports:
          http:
            port: 80
    route:
      external:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        hostnames:
          - strength.grendel71.net
        parentRefs:
          - name: envoy-external
            namespace: envoy-gateway-system
            sectionName: https
        rules:
          - backendRefs:
              - name: web
                port: 80

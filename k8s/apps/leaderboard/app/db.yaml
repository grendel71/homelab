apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: leaderboard-db
  namespace: leaderboard
spec:
  instances: 1
  bootstrap:
    initdb:
      database: leaderboard
      owner: leaderboard
      secret:
        name: leaderboard-db-secret
  storage:
    size: 2Gi
    storageClass: replicated-x3-block-store

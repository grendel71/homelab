---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: website
  namespace: apps
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      website:
        replicas: 3
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: caddy
              tag: 2-alpine
            ports:
              - name: http
                containerPort: 80
              - name: https
                containerPort: 443
            resources:
              requests:
                memory: 64Mi
                cpu: 50m
              limits:
                memory: 256Mi
                cpu: 500m
    configMaps:
      caddyfile:
        data:
          Caddyfile: |
            :80 {
                route {
                    @slash path_regexp slash ^(.*)/+$
                    rewrite @slash /my-bucket{re.slash.1}/index.html

                    @noext {
                        not path *.*
                    }
                    rewrite @noext /my-bucket{path}/index.html

                    rewrite * /my-bucket{uri}

                    reverse_proxy http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc.cluster.local
                }
            }
    persistence:
      caddyfile:
        type: configMap
        identifier: caddyfile
        globalMounts:
          - path: /etc/caddy/Caddyfile
            subPath: Caddyfile
    service:
      app:
        controller: website
        ports:
          http:
            port: 80
          https:
            port: 443
    route:
      external:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        hostnames:
          - me.grendel71.net
        parentRefs:
          - name: envoy-external
            namespace: envoy-gateway-system
            sectionName: https

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: website
  namespace: flux-system
spec:
  targetNamespace: apps
  interval: 30m
  path: ./k8s/apps/website/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  components:
    - ../../../common/all-namespaces
  dependsOn:
    - name: namespace
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: website
      namespace: apps
  timeout: 5m
  wait: false

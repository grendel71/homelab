---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud-new
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      nextcloud:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/nextcloud
              tag: latest
            ports:
              - name: https
                containerPort: 443
            env:
              PGID: "100"
              PUID: "1041"
              TZ: Europe/Amsterdam
              NEXTCLOUD_TRUSTED_DOMAINS: "nextcloud.grendel71.net nextcloud.k8s.grendel71.net"
    persistence:
      config:
        existingClaim: nextcloud-data-pvc
        globalMounts:
          - path: /config
            subPath: config
          - path: /data
            subPath: data
      grendel:
        existingClaim: grendel-nc-pvc
        globalMounts:
          - path: /mnt/grendel
            subPath: nextcloud
    service:
      app:
        controller: nextcloud
        annotations:
          traefik.ingress.kubernetes.io/service.serversscheme: https
          traefik.ingress.kubernetes.io/service.serverstransport: nextcloud-new-skipverify@kubernetescrd
        ports:
          https:
            port: 443

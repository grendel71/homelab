---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tuwunel-data-pvc
  namespace: apps
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: replicated-x3-block-store
  volumeMode: Filesystem
  resources:
    requests:
      storage: 15Gi

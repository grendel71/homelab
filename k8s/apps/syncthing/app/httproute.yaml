---
# HTTPRoute for syncthing web UI - EXTERNAL
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: syncthing
  namespace: apps
spec:
  parentRefs:
    - name: envoy-nx
      namespace: envoy-gateway-system
      sectionName: websecure
  hostnames:
    - st.x.nx8192.win
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: syncthing
          port: 8384

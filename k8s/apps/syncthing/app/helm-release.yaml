---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syncthing
  namespace: apps
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      syncthing:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/syncthing
              tag: latest
            env:
              PUID: "3000"
              PGID: "3000"
              TZ: America/New_York
            ports:
              - name: webui
                containerPort: 8384
              - name: sync-tcp
                containerPort: 22000
                protocol: TCP
              - name: discovery
                containerPort: 21027
                protocol: UDP
    persistence:
      config:
        existingClaim: syncthing-config-pvc
        globalMounts:
          - path: /config
      data:
        existingClaim: syncthing-nc-pvc
        globalMounts:
          - path: /data
            subPath: syncthing
    service:
      app:
        forceRename: syncthing
        controller: syncthing
        ports:
          webui:
            port: 8384
      sync:
        forceRename: syncthing-sync
        controller: syncthing
        ports:
          sync-tcp:
            port: 22000
      discovery:
        forceRename: syncthing-discovery
        controller: syncthing
        ports:
          discovery:
            port: 21027
            protocol: UDP

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik
  namespace: flux-system
spec:
  targetNamespace: authentik
  interval: 30m
  path: ./k8s/apps/authentik/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  components:
    - ../../../common/all-namespaces
  dependsOn:
    - name: namespace
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: authentik
      namespace: authentik
  timeout: 5m
  wait: false

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: payments
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: namespace
    - name: cloudnative-pg
  sourceRef:
    kind: GitRepository
    name: payment-processor
    namespace: flux-system
  path: ./k8s
  prune: true
  timeout: 5m
  wait: true
  patches:
    - patch: |-
        - op: replace
          path: /spec/parentRefs
          value:
            - name: envoy-internal
              namespace: envoy-gateway-system
              sectionName: websecure
        - op: replace
          path: /spec/hostnames
          value:
            - papi.internal.grendel71.net
      target:
        group: gateway.networking.k8s.io
        version: v1
        kind: HTTPRoute
        name: payments-platform-internal
        namespace: payments
  decryption:
    provider: sops
    secretRef:
      name: sops-age

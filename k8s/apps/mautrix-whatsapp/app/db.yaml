apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mautrix-whatsapp-db
  namespace: apps
spec:
  instances: 1
  bootstrap:
    initdb:
      database: mautrixwhatsapp
      owner: mautrixwhatsapp
      secret:
        name: mautrix-whatsapp-db-secret
  storage:
    size: 2Gi
    storageClass: replicated-x3-block-store

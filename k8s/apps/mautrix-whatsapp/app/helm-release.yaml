---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mautrix-whatsapp
  namespace: apps
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      mautrix-whatsapp:
        strategy: Recreate
        containers:
          app:
            image:
              repository: dock.mau.dev/mautrix/whatsapp
              tag: latest
            command:
              - /usr/bin/mautrix-whatsapp
            args:
              - -c
              - /data/config.yaml
              - --no-update
            ports:
              - name: http
                containerPort: 29321
            envFrom:
              - secretRef:
                  name: mautrix-whatsapp-bridge-secret
            resources:
              requests:
                memory: 256Mi
                cpu: 100m
              limits:
                memory: 512Mi
                cpu: 500m
    configMaps:
      config:
        data:
          config.yaml: |
            # Network-specific config options
            network:
                os_name: Mautrix-WhatsApp bridge
                browser_name: unknown
                proxy:
                get_proxy_from:
                proxy_only_login: false
                call_start_notices: true
                identity_change_notices: false
                send_presence_on_typing: false
                enable_status_broadcast: true
                disable_status_broadcast_send: false
                mute_status_broadcast: false
                status_broadcast_tag: m.lowpriority
                pinned_tag:
                archive_tag:
                whatsapp_thumbnail: false
                url_previews: true
                extev_polls: true
                disable_view_once: false
                force_active_delivery_receipts: false
                direct_media_auto_request: false
                initial_auto_reconnect: true
                use_whatsapp_retry_store: true
                displayname_template: '{{`{{or .BusinessName .PushName .Phone .RedactedPhone "Unknown user"}} (WA)`}}'

                animated_sticker:
                    target: webp
                    args:
                        width: 256
                        height: 256
                        fps: 15

                history_sync:
                    max_initial_conversations: -1
                    request_full_sync: false
                    full_sync_config:
                        days_limit: 3650
                        size_mb_limit: 100
                        storage_quota_mb: 10240
                    media_requests:
                        auto_request_media: true
                        request_method: immediate
                        request_local_time: 420
                        max_async_handle: 20000
                    dispatch_wait: 3s
                    backwards_on_demand: true

            bridge:
                command_prefix: '!wa'
                personal_filtering_spaces: true
                private_chat_portal_meta: true
                async_events: false
                split_portals: false
                resend_bridge_info: false
                no_bridge_info_state_key: false
                bridge_status_notices: errors
                unknown_error_auto_reconnect: null
                unknown_error_max_auto_reconnects: 10
                bridge_matrix_leave: false
                bridge_notices: false
                tag_only_on_create: true
                only_bridge_tags: [m.favourite, m.lowpriority]
                mute_only_on_create: true
                deduplicate_matrix_messages: false
                cross_room_replies: false
                revert_failed_state_changes: false
                kick_matrix_users: true
                enable_send_state_requests: false
                phone_numbers_in_profile: false

                cleanup_on_logout:
                    enabled: false
                    manual:
                        private: nothing
                        relayed: nothing
                        shared_no_users: nothing
                        shared_has_users: nothing
                    bad_credentials:
                        private: nothing
                        relayed: nothing
                        shared_no_users: nothing
                        shared_has_users: nothing

                relay:
                    enabled: false
                    admin_only: true
                    prefer_default: true
                    allow_bridge: true
                    default_relays: []
                    message_formats:
                        m.text: '{{`<b>{{ .Sender.DisambiguatedName }}</b>: {{ .Message }}`}}'
                        m.notice: '{{`<b>{{ .Sender.DisambiguatedName }}</b>: {{ .Message }}`}}'
                        m.emote: '{{`* <b>{{ .Sender.DisambiguatedName }}</b> {{ .Message }}`}}'
                        m.file: '{{`<b>{{ .Sender.DisambiguatedName }}</b> sent a file{{ if .Caption }}: {{ .Caption }}{{ end }}`}}'
                        m.image: '{{`<b>{{ .Sender.DisambiguatedName }}</b> sent an image{{ if .Caption }}: {{ .Caption }}{{ end }}`}}'
                        m.audio: '{{`<b>{{ .Sender.DisambiguatedName }}</b> sent an audio file{{ if .Caption }}: {{ .Caption }}{{ end }}`}}'
                        m.video: '{{`<b>{{ .Sender.DisambiguatedName }}</b> sent a video{{ if .Caption }}: {{ .Caption }}{{ end }}`}}'
                        m.location: '{{`<b>{{ .Sender.DisambiguatedName }}</b> sent a location{{ if .Caption }}: {{ .Caption }}{{ end }}`}}'
                    displayname_format: '{{`{{ .DisambiguatedName }}`}}'

                portal_create_filter:
                    mode: deny
                    list: []
                    always_deny_from_login: []

                # Permissions for using the bridge.
                permissions:
                    "@blau:tw.envoy.grendel71.net": admin

            # Config for the bridge's database.
            database:
                type: postgres
                # Overridden at runtime via BRIDGE_DATABASE__URI env var (see mautrix-whatsapp-bridge-secret)
                uri: postgres://replaced-by-env-var
                max_open_conns: 5
                max_idle_conns: 1
                max_conn_idle_time: null
                max_conn_lifetime: null

            # Homeserver details.
            homeserver:
                address: http://tuwunel:8008
                domain: tw.envoy.grendel71.net
                software: standard
                status_endpoint:
                message_send_checkpoint_endpoint:
                async_media: false
                websocket: false
                ping_interval_seconds: 0
                retry_limit: 4

            # Application service host/registration related details.
            appservice:
                address: http://mautrix-whatsapp:29321
                public_address:
                hostname: 0.0.0.0
                port: 29321
                id: whatsapp
                bot:
                    username: whatsappbot
                    displayname: WhatsApp Bridge Bot
                    avatar: mxc://maunium.net/NeXNQarUbrlYBiPCpprYsRqr
                ephemeral_events: true
                async_transactions: false
                # Overridden at runtime via BRIDGE_APPSERVICE__AS_TOKEN / __HS_TOKEN env vars
                as_token: "replaced-by-env-var"
                hs_token: "replaced-by-env-var"
                username_template: '{{`whatsapp_{{.}}`}}'

            matrix:
                message_status_events: false
                delivery_receipts: false
                message_error_notices: true
                sync_direct_chat_list: true
                federate_rooms: true
                upload_file_threshold: 5242880
                ghost_extra_profile_info: false

            analytics:
                token: null
                url: https://api.segment.io/v1/track
                user_id: null

            # Settings for provisioning API
            provisioning:
                # Overridden at runtime via BRIDGE_PROVISIONING__SHARED_SECRET env var
                shared_secret: "replaced-by-env-var"
                allow_matrix_auth: true
                debug_endpoints: false
                enable_session_transfers: false
                fail_on_webauthn: false

            public_media:
                enabled: false
                signing_key: generate
                expiry: 0
                hash_length: 32
                path_prefix: /_mautrix/publicmedia
                use_database: false

            direct_media:
                enabled: false
                server_name: discord-media.example.com
                well_known_response:
                media_id_prefix:
                allow_proxy: true
                server_key: generate

            backfill:
                enabled: true
                max_initial_messages: 50
                max_catchup_messages: 500
                unread_hours_threshold: 720
                threads:
                    max_initial_messages: 50
                queue:
                    enabled: false
                    manual: false
                    batch_size: 100
                    batch_delay: 20
                    max_batches: -1
                    max_batches_override: {}

            double_puppet:
                servers: {}
                allow_discovery: false
                secrets: {}

            # End-to-bridge encryption support options.
            encryption:
                allow: true
                default: false
                require: false
                appservice: false
                msc4190: false
                msc4392: false
                self_sign: false
                allow_key_sharing: true
                plaintext_mentions: false
                # Overridden at runtime via BRIDGE_ENCRYPTION__PICKLE_KEY env var
                pickle_key: "replaced-by-env-var"
                delete_keys:
                    delete_outbound_on_ack: false
                    dont_store_outbound: false
                    ratchet_on_decrypt: false
                    delete_fully_used_on_decrypt: false
                    delete_prev_on_new_session: false
                    delete_on_device_delete: false
                    periodically_delete_expired: false
                    delete_outdated_inbound: false
                verification_levels:
                    receive: unverified
                    send: unverified
                    share: cross-signed-tofu
                rotation:
                    enable_custom: false
                    milliseconds: 604800000
                    messages: 100
                    disable_device_change_key_rotation: false

            # Prefix for environment variables used to override config fields at runtime.
            env_config_prefix: BRIDGE_

            logging:
                min_level: info
                writers:
                    - type: stdout
                      format: pretty-colored
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /data/config.yaml
            subPath: config.yaml
            readOnly: true
    service:
      app:
        controller: mautrix-whatsapp
        ports:
          http:
            port: 29321

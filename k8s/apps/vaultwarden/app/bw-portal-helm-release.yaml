---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bw-portal
  namespace: vaultwarden
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      hostAliases:
        - ip: "192.168.1.71"
          hostnames:
            - "v.x.nx8192.win"
    controllers:
      bw-portal:
        strategy: Recreate
        containers:
          app:
            image:
              repository: bhcr8192.duckdns.org/bitwarden-portal
              tag: "1761076800" # {"$imagepolicy": "vaultwarden:bitwarden-portal-policy:tag"}
            envFrom:
              - secretRef:
                  name: bw-portal-secret
            resources:
              requests:
                memory: 128Mi
                cpu: 50m
              limits:
                memory: 512Mi
                cpu: 500m
    persistence:
      backups:
        existingClaim: bw-portal-backup-pvc
        globalMounts:
          - path: /app/backups
            subPath: bw-portal

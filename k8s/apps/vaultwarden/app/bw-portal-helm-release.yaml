apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bw-portal
  namespace: vaultwarden
spec:
  interval: 30m
  dependsOn:
    - name: bw-portal-redis
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      hostAliases:
        - ip: "192.168.1.71"
          hostnames:
            - "v.x.nx8192.win"
    controllers:
      # API: accepts requests and puts backup jobs on the queue.
      bw-portal:
        strategy: Recreate
        containers:
          app:
            image:
              repository: bhcr8192.duckdns.org/bitwarden-portal
              tag: "1793240197" # {"$imagepolicy": "vaultwarden:bitwarden-portal-policy:tag"}
            ports:
              - name: http
                containerPort: 8000
            envFrom:
              - secretRef:
                  name: bw-portal-secret
              - configMapRef:
                  name: bw-portal-config
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: http
                  initialDelaySeconds: 5
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: http
                  initialDelaySeconds: 5
                  periodSeconds: 10
            resources:
              requests:
                memory: 128Mi
                cpu: 50m
              limits:
                memory: 512Mi
                cpu: 500m
      # Worker: runs the queued backup jobs.
      # Keep exactly one replica. Backups must not run at the same time:
      # the bw CLI uses one shared login session and the file name has minute resolution.
      bw-portal-worker:
        strategy: Recreate
        replicas: 1
        containers:
          app:
            image:
              repository: bhcr8192.duckdns.org/bitwarden-portal
              tag: "1793240197" # {"$imagepolicy": "vaultwarden:bitwarden-portal-policy:tag"}
            command:
              - rq
              - worker
            envFrom:
              - secretRef:
                  name: bw-portal-secret
              - configMapRef:
                  name: bw-portal-config
            # The worker has no HTTP port, so the default probes do not apply.
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                memory: 128Mi
                cpu: 50m
              limits:
                memory: 512Mi
                cpu: 500m
    persistence:
      # Only the worker writes backups. The API does not mount this volume.
      backups:
        existingClaim: bw-portal-backup-pvc
        advancedMounts:
          bw-portal-worker:
            app:
              - path: /app/backups
                subPath: bw-portal
    service:
      bitwarden-portal:
        forceRename: bitwarden-portal
        controller: bw-portal
        ports:
          http:
            port: 8000

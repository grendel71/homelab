---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bw-portal
  namespace: vaultwarden
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      bw-portal:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/grendel71/bitwarden-portal
              tag: latest
            envFrom:
              - secretRef:
                  name: bw-portal-secret
            resources:
              requests:
                memory: 128Mi
                cpu: 50m
              limits:
                memory: 512Mi
                cpu: 500m
    persistence:
      backups:
        existingClaim: bw-portal-backup-pvc
        globalMounts:
          - path: /app/backups
            subPath: bw-portal

apiVersion: batch/v1
kind: CronJob
metadata:
  name: vaultwarden-daily
  namespace: vaultwarden
spec:
  concurrencyPolicy: "Forbid"
  schedule: "10 0 * * *"
  timezone: "America/New_York"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: ingestion
              image: curlimages/curl:8.17.0
              imagePullPolicy: IfNotPresent
              # --fail-with-body makes curl exit non-zero on HTTP 4xx/5xx, so a
              # failed request fails the Job. The response body shows the job id.
              args:
                - "-sS"
                - "--fail-with-body"
                - "-X"
                - "POST"
                - "http://bitwarden-portal.vaultwarden.svc:8000/api/queueBackup"
          restartPolicy: OnFailure

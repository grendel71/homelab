apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: payments
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: namespace
    - name: cloudnative-pg
  sourceRef:
    kind: GitRepository
    name: payment-processor
    namespace: flux-system
  path: ./k8s
  prune: true
  timeout: 5m
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
